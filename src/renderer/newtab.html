<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'; form-action https://www.google.com">
  <title>Nouvel onglet</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula n1"></div><div class="nebula n2"></div><div class="nebula n3"></div>
  <div class="twinkles" id="twinkles" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>

  <header class="corner">
    <img src="assets/logo-small.svg" alt=""><span>Maxou's Nav</span>
  </header>

  <main>
    <div class="clock" id="clock">--:--</div>
    <p id="greet" class="greet"></p>

    <form action="https://www.google.com/search" method="get" class="search">
      <svg class="g" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.2C12.5 13.6 17.8 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.4 5.7c4.3-4 6.9-9.9 6.9-17.2z"/>
        <path fill="#FBBC05" d="M10.6 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.2A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.2-13.4-9.9l-8 6.1C6.6 42.6 14.6 48 24 48z"/>
      </svg>
      <input name="q" type="search" placeholder="Rechercher sur Google" autocomplete="off" spellcheck="false">
      <button type="submit" aria-label="Rechercher">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <nav class="tiles" id="tiles"></nav>
  </main>

  <footer><span class="dot"></span>Protégé : pubs, traqueurs et sites dangereux bloqués · <a href="#" id="reset-tiles">Raccourcis par défaut</a></footer>

  <div id="add-dialog" hidden>
    <form id="add-form" class="dlg">
      <h2>Ajouter un raccourci</h2>
      <label>Nom<input id="add-name" type="text" placeholder="ex. Discord" autocomplete="off" spellcheck="false"></label>
      <label>Adresse<input id="add-url" type="text" placeholder="ex. discord.com" autocomplete="off" spellcheck="false" required></label>
      <p id="add-err"></p>
      <div class="dlg-actions">
        <button type="button" id="add-cancel" class="ghost">Annuler</button>
        <button type="submit" class="go">Ajouter</button>
      </div>
    </form>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
