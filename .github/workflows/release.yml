# Publie automatiquement une nouvelle version de Maxou's Nav
# dès que le numéro de version change dans package.json (branche main).
name: Publier une version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Nouvelle version à publier ?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La version $V est déjà publiée : rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version $V : compilation et publication."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer les dépendances
        if: steps.ver.outputs.publish == 'true'
        run: npm ci

      - name: Listes anti-pubs à jour
        if: steps.ver.outputs.publish == 'true'
        run: node scripts/update-adblock-lists.js

      - name: Compiler l'appli et la version portable
        if: steps.ver.outputs.publish == 'true'
        run: npx electron-builder --win dir portable --publish never

      - name: Créer l'installateur
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $makensis = Get-ChildItem "$env:LOCALAPPDATA\electron-builder\Cache" -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\Bin\\' } | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $makensis) { choco install nsis -y --no-progress; $makensis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          Write-Host "makensis : $makensis"
          $version = node -p "require('./package.json').version"
          Push-Location build
          & $makensis /V2 "/DVERSION=$version" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Fichier de mise à jour (latest.json)
        if: steps.ver.outputs.publish == 'true'
        run: node scripts/make-latest.js

      - name: Publier la release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Maxou's Nav ${{ steps.ver.outputs.version }}
          make_latest: true
          generate_release_notes: true
          body: |
            **Installer :** télécharge `Maxous-Nav-Installation-*.exe` ci-dessous.
            Si Maxou's Nav est déjà installé, il se mettra à jour tout seul.
          files: |
            dist/Maxous-Nav-Installation-*.exe
            dist/Maxous-Nav-Portable-*.exe
            dist/latest.json
